plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 работает на Java 21, Kotlin компилируется под ту же версию.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
kotlin {
    jvmToolchain(21)
}

sourceSets.main.resources {
    // Результат датагена лежит отдельно от ресурсов, написанных руками.
    srcDir('src/generated/resources')
    exclude('.cache/**')
}

repositories {
    mavenCentral()
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {
    }

    server {
        argument '--nogui'
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // Загрузчик языка Kotlin для NeoForge: приносит стандартную библиотеку Kotlin и шину MOD_BUS.
    implementation "thedarkcolour:kotlinforforge-neoforge:${kff_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            kff_version            : kff_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
